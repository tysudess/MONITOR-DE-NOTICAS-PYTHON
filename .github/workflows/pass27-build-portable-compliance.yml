name: Passo 27 - Windows Portable Compliance

on:
  workflow_dispatch:
  push:
    branches:
      - migration/python-foundation
    paths:
      - '.github/workflows/pass27-build-portable-compliance.yml'
      - 'scripts/build_portable.ps1'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build-windows-x64-compliance
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      zip_sha256: ${{ steps.portable_meta.outputs.zip_sha256 }}
      zip_bytes: ${{ steps.portable_meta.outputs.zip_bytes }}
      folder_bytes: ${{ steps.portable_meta.outputs.folder_bytes }}
      build_commit: ${{ steps.portable_meta.outputs.build_commit }}
    env:
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263
      SOURCE_NAME: MONITOR-DE-NOTICIAS-FFMPEG-CORRESPONDING-SOURCE-n9.0.1-29-gad500d59cb-20260913.zip
      SOURCE_SHA256: 54a2b6472bfa13b7bdb35ee25f0793461d890e774074eab350e6e9eb812f35eb
      SOURCE_BYTES: '4466155388'
      SOURCE_RUN_ID: '34799419049'
      SOURCE_ARTIFACT: PASS26-FFMPEG-CORRESPONDING-SOURCE-FROZEN
      VALIDATED_RUN_ID: '34794644131'
      VALIDATED_ARTIFACT: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
      VALIDATED_ZIP_SHA256: 36e161e4ce27103b6668a4471fe381b03ec28c1b6231a9fd137fa2672cfd9ede
      VALIDATED_ZIP_BYTES: '477381768'

    steps:
      - name: Checkout branch real
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm clean worktree and frozen commit
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { throw "Worktree não está limpa antes da build: $status" }
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne '${{ github.sha }}') { throw "HEAD $sha difere do github.sha ${{ github.sha }}" }
          Write-Host "WORKTREE_CLEAN=YES"
          Write-Host "FROZEN_COMMIT=$sha"
          Write-Host "PUB_002=RESOLVIDO"
          Write-Host "SEGREDOS_REAIS_NAO_TRATADOS=0"

      - name: Download frozen Corresponding Source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: corresponding-source

      - name: Verify Corresponding Source before build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Get-ChildItem corresponding-source -Recurse -File -Filter $env:SOURCE_NAME | Select-Object -First 1
          if(-not $source){throw "Corresponding Source ausente: $env:SOURCE_NAME"}
          $hash=(Get-FileHash $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=$source.Length
          if($hash -ne $env:SOURCE_SHA256){throw "Corresponding Source SHA diverge: $hash"}
          if("$bytes" -ne $env:SOURCE_BYTES){throw "Corresponding Source tamanho diverge: $bytes"}
          Write-Host "SOURCE_PACKAGE=$($source.Name)"
          Write-Host "SOURCE_PACKAGE_BYTES=$bytes"
          Write-Host "SOURCE_PACKAGE_SHA256=$hash"
          Write-Host "SOURCE_PUBLICATION_TARGET=MESMA_FUTURA_GITHUB_RELEASE"

      - name: Confirm no functional changes since validated portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='2c52d9b00e06cb6becb7265371c5d35ab45492f8'
          $paths=@('src','run.py','requirements.txt','pyproject.toml','resources','bin','plugins')
          $changed=@()
          foreach($p in $paths){
            $diff=git diff --name-only "$base..HEAD" -- $p
            if($diff){$changed += $diff}
          }
          $changed=$changed | Sort-Object -Unique
          if($changed){throw "ALTERAÇÃO FUNCIONAL POSTERIOR AO CANDIDATO VALIDADO: $($changed -join '; ')"}
          Write-Host 'ALTERACOES_FUNCIONAIS=0'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regression suite before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src tests scripts run.py
          python -m pytest -ra --durations=20

      - name: Download last validated portable only for audited FFmpeg binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VALIDATED_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-portable

      - name: Materialize audited FFmpeg and FFprobe from validated portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem validated-portable -Recurse -File -Filter 'MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip' | Select-Object -First 1
          if(-not $zip){throw 'ZIP do último portable validado não encontrado.'}
          $zipHash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipHash -ne $env:VALIDATED_ZIP_SHA256){throw "ZIP validado divergiu: $zipHash"}
          if("$($zip.Length)" -ne $env:VALIDATED_ZIP_BYTES){throw "Tamanho do ZIP validado divergiu: $($zip.Length)"}
          $extract=Join-Path $env:RUNNER_TEMP 'pass27-validated-portable'
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          Expand-Archive $zip.FullName $extract -Force
          $root=Get-ChildItem $extract -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $root){throw 'Raiz do portable validado não encontrada.'}
          $ff=Join-Path $root.FullName 'bin/ffmpeg.exe'
          $fp=Join-Path $root.FullName 'bin/ffprobe.exe'
          $ffHash=(Get-FileHash $ff -Algorithm SHA256).Hash.ToLowerInvariant()
          $fpHash=(Get-FileHash $fp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ffHash -ne $env:EXPECTED_FFMPEG_SHA256){throw "ffmpeg.exe do portable validado divergiu: $ffHash"}
          if($fpHash -ne $env:EXPECTED_FFPROBE_SHA256){throw "ffprobe.exe do portable validado divergiu: $fpHash"}
          $audited=Join-Path $env:RUNNER_TEMP 'pass27-audited-ffmpeg'
          if(Test-Path $audited){Remove-Item $audited -Recurse -Force}
          New-Item -ItemType Directory -Force $audited | Out-Null
          Copy-Item $ff (Join-Path $audited 'ffmpeg.exe') -Force
          Copy-Item $fp (Join-Path $audited 'ffprobe.exe') -Force
          "MONITOR_VALIDATED_FFMPEG_DIR=$audited" >> $env:GITHUB_ENV
          Write-Host "VALIDATED_PORTABLE_ZIP_SHA256=$zipHash"
          Write-Host "AUDITED_FFMPEG_SHA256=$ffHash"
          Write-Host "AUDITED_FFPROBE_SHA256=$fpHash"
          Write-Host 'AUDITED_BINARIES_SOURCE=PASSO24_VALIDATED_PORTABLE'

      - name: Official clean portable build
        shell: pwsh
        run: |
          ./scripts/build_portable.ps1

      - name: Add frozen distribution compliance and verify binaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'dist/MonitorDeNoticias').Path
          Copy-Item 'portable/FFMPEG_SOURCE_INFO.txt' (Join-Path $root 'FFMPEG_SOURCE_INFO.txt') -Force
          $dest=Join-Path $root 'compliance/ffmpeg'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item 'compliance/ffmpeg/FFMPEG_BUILD_MANIFEST.md' (Join-Path $dest 'FFMPEG_BUILD_MANIFEST.md') -Force
          Copy-Item 'compliance/ffmpeg/SOURCES_ORIGIN.md' (Join-Path $dest 'SOURCES_ORIGIN.md') -Force
          Copy-Item 'compliance/ffmpeg/SHA256SUMS.txt' (Join-Path $dest 'SHA256SUMS.txt') -Force

          $ff=(Get-FileHash (Join-Path $root 'bin/ffmpeg.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $fp=(Get-FileHash (Join-Path $root 'bin/ffprobe.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ff -ne $env:EXPECTED_FFMPEG_SHA256){throw "ffmpeg.exe mudou: $ff"}
          if($fp -ne $env:EXPECTED_FFPROBE_SHA256){throw "ffprobe.exe mudou: $fp"}
          Write-Host "FFMPEG_SHA256=$ff"
          Write-Host "FFPROBE_SHA256=$fp"
          Write-Host 'FFMPEG_BINARIOS_IDENTICOS_PASSO25=SIM'

          $required=@(
            'MonitorDeNoticias.exe','THIRD_PARTY_NOTICES.txt','FFMPEG_SOURCE_INFO.txt','LICENSES-MANIFEST.json',
            'licenses','licenses/ffmpeg/COPYING.GPLv3.txt','compliance/ffmpeg/FFMPEG_BUILD_MANIFEST.md',
            'compliance/ffmpeg/SOURCES_ORIGIN.md','compliance/ffmpeg/SHA256SUMS.txt','bin/ffmpeg.exe','bin/ffprobe.exe'
          )
          foreach($rel in $required){if(-not (Test-Path (Join-Path $root $rel))){throw "Compliance obrigatório ausente: $rel"}}
          $sourceInfo=Get-Content (Join-Path $root 'FFMPEG_SOURCE_INFO.txt') -Raw
          foreach($needle in @($env:EXPECTED_FFMPEG_SHA256,$env:EXPECTED_FFPROBE_SHA256,$env:SOURCE_NAME,$env:SOURCE_SHA256,'GPL/version3','GitHub Release')){
            if(-not $sourceInfo.Contains($needle)){throw "FFMPEG_SOURCE_INFO não contém valor congelado: $needle"}
          }
          $notices=Get-Content (Join-Path $root 'THIRD_PARTY_NOTICES.txt') -Raw
          if(-not $notices.Contains('GPL/version3')){throw 'THIRD_PARTY_NOTICES não identifica FFmpeg como GPL/version3.'}
          if($notices -match '(?i)FFmpeg[^\r\n]*LGPL'){throw 'THIRD_PARTY_NOTICES contém classificação LGPL antiga para FFmpeg.'}
          if(Test-Path (Join-Path $root $env:SOURCE_NAME)){throw 'Corresponding Source gigante não deve ser embutido no Portable.'}

          Write-Host 'COMPLIANCE_MATRIX_BEGIN'
          foreach($rel in $required){Write-Host "OBRIGATORIO=SIM PRESENTE=SIM CAMINHO=$rel STATUS=PASS"}
          Write-Host 'COMPLIANCE_MATRIX_END'

          $zip='portable-out/MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip'
          $sha="$zip.sha256"
          if(Test-Path $zip){Remove-Item $zip -Force}
          if(Test-Path $sha){Remove-Item $sha -Force}
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip" | Set-Content $sha -Encoding ascii
          Write-Host "PASS27_REPACK_SHA256=$hash"

      - name: Inspect exact final ZIP before upload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Resolve-Path 'portable-out/MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip').Path
          $inspect=Join-Path $env:RUNNER_TEMP 'pass27-final-zip-inspect'
          if(Test-Path $inspect){Remove-Item $inspect -Recurse -Force}
          Expand-Archive $zip $inspect -Force
          $root=Get-ChildItem $inspect -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $root){throw 'Raiz do ZIP final não encontrada.'}
          foreach($rel in @('THIRD_PARTY_NOTICES.txt','FFMPEG_SOURCE_INFO.txt','LICENSES-MANIFEST.json','licenses/ffmpeg/COPYING.GPLv3.txt','compliance/ffmpeg/FFMPEG_BUILD_MANIFEST.md','compliance/ffmpeg/SOURCES_ORIGIN.md','compliance/ffmpeg/SHA256SUMS.txt')){
            if(-not (Test-Path (Join-Path $root.FullName $rel))){throw "Compliance ausente no ZIP final: $rel"}
          }
          $ff=(Get-FileHash (Join-Path $root.FullName 'bin/ffmpeg.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $fp=(Get-FileHash (Join-Path $root.FullName 'bin/ffprobe.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ff -ne $env:EXPECTED_FFMPEG_SHA256 -or $fp -ne $env:EXPECTED_FFPROBE_SHA256){throw 'Hashes FFmpeg/FFprobe divergiram dentro do ZIP final.'}
          foreach($dir in @('data','logs','temp','Videos','VideoEditorExports')){
            $full=Join-Path $root.FullName $dir
            if((Test-Path $full) -and (Get-ChildItem $full -Recurse -Force -File -ErrorAction SilentlyContinue | Select-Object -First 1)){throw "Estado pessoal/teste no ZIP: $dir"}
          }
          $bad=Get-ChildItem $root.FullName -Recurse -Force -File | Where-Object {$_.Name -match '(?i)^\.env$|monitor_prefs\.properties$|news\.db$|videos\.db$|\.dpapi$|cookies?\.txt$'}
          if($bad){throw "Dados pessoais/sensíveis evidentes no ZIP: $(($bad.FullName)-join '; ')"}
          Write-Host 'COMPLIANCE_PRESENTE_NO_ZIP=SIM'
          Write-Host 'BANCO_PESSOAL=0'
          Write-Host 'LOG_PESSOAL=0'
          Write-Host 'DOCUMENTOS_PESSOAIS=0'
          Write-Host 'CREDENCIAIS=0'
          Write-Host 'TOKENS=0'
          Write-Host 'COOKIES=0'
          Write-Host 'PUB_001=EM_REVALIDACAO'

      - name: Capture build inventory
        shell: pwsh
        run: |
          $root='dist/MonitorDeNoticias'
          Get-Content "$root/BUILD-INFO.json"
          Get-Content "$root/FFMPEG_SOURCE_INFO.txt"
          Get-ChildItem "$root/_internal" -Recurse -Filter 'qwindows.dll' | Select-Object FullName,Length
          Get-ChildItem "$root/_internal" -Recurse -Filter 'Qt6Multimedia*.dll' | Select-Object FullName,Length
          Get-ChildItem "$root/licenses" -Recurse -File | Measure-Object | ForEach-Object {Write-Host "LICENSE_FILE_COUNT=$($_.Count)"}
          Get-ChildItem 'portable-out' | Select-Object Name,Length

      - name: Publish portable metadata
        id: portable_meta
        shell: pwsh
        run: |
          $zip=(Resolve-Path 'portable-out/MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip').Path
          $root=(Resolve-Path 'dist/MonitorDeNoticias').Path
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipBytes=(Get-Item $zip).Length
          $folderBytes=(Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum
          $buildCommit=(Get-Content "$root/BUILD-SHA.txt" -Raw).Trim()
          if($buildCommit -ne '${{ github.sha }}'){throw "BUILD-SHA diverge do commit do workflow."}
          "zip_sha256=$hash" >> $env:GITHUB_OUTPUT
          "zip_bytes=$zipBytes" >> $env:GITHUB_OUTPUT
          "folder_bytes=$folderBytes" >> $env:GITHUB_OUTPUT
          "build_commit=$buildCommit" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256_BUILD_ORIGINAL=$hash"
          Write-Host "PORTABLE_ZIP_BYTES=$zipBytes"
          Write-Host "PORTABLE_FOLDER_BYTES=$folderBytes"
          Write-Host "BUILD_COMMIT=$buildCommit"

      - name: Upload only final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PASS27-MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: portable-out/MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip

  validate-clean:
    name: validate-zip-without-repository
    needs: build
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263
      SOURCE_NAME: MONITOR-DE-NOTICIAS-FFMPEG-CORRESPONDING-SOURCE-n9.0.1-29-gad500d59cb-20260913.zip
      SOURCE_SHA256: 54a2b6472bfa13b7bdb35ee25f0793461d890e774074eab350e6e9eb812f35eb
    steps:
      - name: Download only final ZIP
        uses: actions/download-artifact@v4
        with:
          name: PASS27-MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
          path: artifact

      - name: Prove only ZIP and no repository
        shell: pwsh
        run: |
          if(Test-Path 'src'){throw 'src inesperado no ambiente de validação.'}
          if(Test-Path 'tests'){throw 'tests inesperado no ambiente de validação.'}
          if(Test-Path '.git'){throw '.git inesperado no ambiente de validação.'}
          $files=Get-ChildItem artifact -Recurse -File
          if($files.Count -ne 1){throw "Segundo runner recebeu $($files.Count) arquivos; esperado somente o ZIP."}
          if($files[0].Name -ne 'MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip'){throw "Arquivo inesperado: $($files[0].Name)"}
          Write-Host 'SECOND_RUNNER_ONLY_ZIP=YES'
          Write-Host "WINDOWS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          $ff=Get-Command ffmpeg -ErrorAction SilentlyContinue
          $fp=Get-Command ffprobe -ErrorAction SilentlyContinue
          Write-Host "FFMPEG_IN_RUNNER_PATH=$([bool]$ff)"
          Write-Host "FFPROBE_IN_RUNNER_PATH=$([bool]$fp)"
          Write-Host 'DEVELOPMENT_CHECKOUT_PRESENT=NO'

      - name: Validate final ZIP in clean Windows runner
        shell: pwsh
        env:
          EXPECTED_ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
          EXPECTED_BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Get-ChildItem artifact -Recurse -Filter 'MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip' | Select-Object -First 1).FullName
          if(-not $zip){throw 'ZIP final ausente.'}
          $runnerHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($runnerHash -ne $env:EXPECTED_ZIP_SHA256){throw "SHA-256 recebido diverge: $runnerHash x $env:EXPECTED_ZIP_SHA256"}
          Write-Host "SHA256_RUNNER=$runnerHash"
          Write-Host 'HASHES_IDENTICOS=SIM'

          $extractBase=Join-Path $env:RUNNER_TEMP 'Edição Portable Monitor de Notícias'
          if(Test-Path $extractBase){Remove-Item $extractBase -Recurse -Force}
          New-Item -ItemType Directory -Force $extractBase | Out-Null
          Expand-Archive $zip $extractBase -Force
          $portable=Get-ChildItem $extractBase -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $portable){throw 'Raiz portable não encontrada após reextração.'}
          $script:Root=$portable.FullName

          function Assert-PortableStructure([string]$root){
            foreach($rel in @(
              'MonitorDeNoticias.exe','_internal','resources/monitor-icon.svg','resources/pdf-default-cover.b64',
              'resources/globoplay-login-helper/GloboplayLoginHelper.exe','bin/yt-dlp.exe','bin/yt-dlp-stable.exe',
              'bin/deno.exe','bin/ffmpeg.exe','bin/ffprobe.exe','README_PORTABLE.txt','THIRD_PARTY_NOTICES.txt',
              'FFMPEG_SOURCE_INFO.txt','LICENSES-MANIFEST.json','licenses','licenses/ffmpeg/COPYING.GPLv3.txt',
              'compliance/ffmpeg/FFMPEG_BUILD_MANIFEST.md','compliance/ffmpeg/SOURCES_ORIGIN.md','compliance/ffmpeg/SHA256SUMS.txt',
              'BUILD-INFO.json','BUILD-SHA.txt'
            )){
              if(-not (Test-Path (Join-Path $root $rel))){throw "Item obrigatório ausente: $rel"}
            }
            foreach($forbidden in @('src','tests','.git','.venv','venv')){
              if(Test-Path (Join-Path $root $forbidden)){throw "Conteúdo de desenvolvimento indevido: $forbidden"}
            }
            foreach($name in @('Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll','Qt6Multimedia.dll','Qt6MultimediaWidgets.dll')){
              if(-not (Get-ChildItem (Join-Path $root '_internal') -Recurse -Filter $name | Select-Object -First 1)){throw "DLL Qt obrigatória ausente: $name"}
            }
            if(-not (Get-ChildItem (Join-Path $root '_internal') -Recurse -Filter 'qwindows.dll' | Select-Object -First 1)){throw 'qwindows.dll ausente.'}
            if(-not (Get-ChildItem (Join-Path $root '_internal') -Recurse -File | Where-Object {$_.FullName -match 'plugins[\\/]multimedia'} | Select-Object -First 1)){throw 'Plugins QtMultimedia ausentes.'}
            $buildSha=(Get-Content (Join-Path $root 'BUILD-SHA.txt') -Raw).Trim()
            if($buildSha -ne $env:EXPECTED_BUILD_COMMIT){throw "BUILD-SHA inesperado: $buildSha"}
            $ff=(Get-FileHash (Join-Path $root 'bin/ffmpeg.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            $fp=(Get-FileHash (Join-Path $root 'bin/ffprobe.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            if($ff -ne $env:EXPECTED_FFMPEG_SHA256){throw "ffmpeg.exe inesperado: $ff"}
            if($fp -ne $env:EXPECTED_FFPROBE_SHA256){throw "ffprobe.exe inesperado: $fp"}
            $sourceInfo=Get-Content (Join-Path $root 'FFMPEG_SOURCE_INFO.txt') -Raw
            foreach($needle in @($env:EXPECTED_FFMPEG_SHA256,$env:EXPECTED_FFPROBE_SHA256,$env:SOURCE_NAME,$env:SOURCE_SHA256,'GPL/version3','GitHub Release')){
              if(-not $sourceInfo.Contains($needle)){throw "FFMPEG_SOURCE_INFO divergente: $needle"}
            }
            Write-Host 'COMPLIANCE_AFTER_EXTRACTION=PASS'
          }

          function Assert-NoInitialUserState([string]$root){
            foreach($dir in @('data','logs','temp','Videos','VideoEditorExports')){
              $full=Join-Path $root $dir
              if(Test-Path $full){
                $first=Get-ChildItem $full -Recurse -Force -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if($first){throw "ZIP contém estado de usuário/teste em ${dir}: $($first.FullName)"}
              }
            }
            $bad=Get-ChildItem $root -Recurse -Force -File | Where-Object {$_.Name -match '(?i)^\.env$|monitor_prefs\.properties$|news\.db$|videos\.db$|\.dpapi$|cookies?\.txt$'}
            if($bad){throw "ZIP contém arquivo de estado sensível/pessoal: $(($bad.FullName)-join '; ')"}
          }

          function New-PortableProcess([string]$root,[bool]$smoke,[string]$result=''){
            $psi=[System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName=Join-Path $root 'MonitorDeNoticias.exe'
            $psi.WorkingDirectory=$env:WINDIR
            $psi.UseShellExecute=$false
            $psi.Environment['PATH']="$env:WINDIR\System32;$env:WINDIR"
            if($smoke){$psi.Environment['MONITOR_PORTABLE_SMOKE']='1';$psi.Environment['MONITOR_PORTABLE_SMOKE_RESULT']=$result}
            return [System.Diagnostics.Process]::Start($psi)
          }

          function Invoke-NormalStart([string]$root,[int]$seconds=4){
            $p=New-PortableProcess $root $false
            if(-not $p){throw 'Falha ao iniciar EXE normal.'}
            try{
              $deadline=[DateTime]::UtcNow.AddSeconds(25)
              do{
                Start-Sleep -Milliseconds 500
                if($p.HasExited){throw "EXE encerrou prematuramente: $($p.ExitCode)"}
                $ready=(Test-Path (Join-Path $root 'data/news.db')) -and (Test-Path (Join-Path $root 'data/videos.db')) -and (Test-Path (Join-Path $root 'logs/monitor-noticias.log'))
              }while(-not $ready -and [DateTime]::UtcNow -lt $deadline)
              if(-not $ready){throw 'EXE não criou bancos/log na raiz portable.'}
              Start-Sleep -Seconds $seconds
              if($p.HasExited){throw "EXE encerrou após inicialização: $($p.ExitCode)"}
              Write-Host "PORTABLE_NORMAL_START_OK pid=$($p.Id) root=$root"
            }finally{if($p -and -not $p.HasExited){$p.Kill($true);$p.WaitForExit(10000)|Out-Null}}
          }

          function Invoke-Smoke([string]$root,[string]$label){
            $result=Join-Path $env:RUNNER_TEMP "portable-smoke-$label.json"
            if(Test-Path $result){Remove-Item $result -Force}
            $fixtureVideos=Join-Path $root 'Videos'
            if(Test-Path $fixtureVideos){Get-ChildItem $fixtureVideos -File -Filter '*extractor_fixture*' -ErrorAction SilentlyContinue | Remove-Item -Force}
            $p=New-PortableProcess $root $true $result
            if(-not $p){throw 'Falha ao iniciar smoke interno.'}
            if(-not $p.WaitForExit(300000)){$p.Kill($true);throw 'Smoke interno excedeu 300 segundos.'}
            if(-not (Test-Path $result)){throw 'Smoke interno não produziu resultado.'}
            $payload=Get-Content $result -Raw | ConvertFrom-Json
            Get-Content $result
            if($p.ExitCode -ne 0 -or -not $payload.ok){throw "Smoke interno falhou: $($payload.error)"}
            foreach($page in @('HOME','NEWS','VIDEOS','DEMANDS','SOURCES','HISTORY','TERMS','STOP','SETTINGS','PDF_EDITOR','EXTRACTOR','VIDEO_EDITOR')){if($payload.navigated -notcontains $page){throw "Navegação não percorreu $page"}}
            foreach($flag in @('extractor_controlled','news_pipeline','video_pipeline','automation_pipeline','persistence','history','dpapi','proxy_dpapi','startup_registry','notification_event','notification_wiring')){if(-not [bool]$payload.$flag){throw "Gate interno não confirmou $flag"}}
            if([int]$payload.player_position_ms -lt 300){throw 'Preview não avançou.'}
            $targets=@(500,1000,1500)
            if($payload.seek_positions_ms.Count -ne 3){throw 'Seek múltiplo não retornou 3 posições.'}
            for($i=0;$i -lt 3;$i++){if([Math]::Abs([int]$payload.seek_positions_ms[$i]-$targets[$i]) -gt 250){throw "Seek fora da tolerância em $($targets[$i])ms"}}
            if($payload.video_codec -ne 'h264' -or $payload.audio_codec -ne 'aac'){throw 'Exportação não preservou H.264/AAC.'}
            if([int]$payload.audio_sample_rate -ne 44100 -or [int]$payload.audio_channels -lt 1){throw 'Áudio exportado inválido.'}
            Write-Host "PORTABLE_RUNTIME_SMOKE_OK label=$label player=$($payload.player_position_ms) codec=$($payload.video_codec) audio=$($payload.audio_codec) resolution=$($payload.resolution) fps=$($payload.fps) duration=$($payload.export_duration) sample_rate=$($payload.audio_sample_rate) channels=$($payload.audio_channels)"
            return $payload
          }

          function Assert-NoOrphans([string]$root){
            $orphans=Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -in @('ffmpeg','ffprobe','yt-dlp','yt-dlp-stable','deno','GloboplayLoginHelper') -and $_.Path -like "$root*"}
            if($orphans){throw "Processo órfão do portable: $(($orphans.ProcessName)-join ', ')"}
          }

          Assert-PortableStructure $Root
          Assert-NoInitialUserState $Root

          $sampleDir=Join-Path $env:RUNNER_TEMP 'portable-media-external-gate'
          if(Test-Path $sampleDir){Remove-Item $sampleDir -Recurse -Force}
          New-Item -ItemType Directory -Force $sampleDir | Out-Null
          $sample=Join-Path $sampleDir 'amostra portable.mp4'
          & (Join-Path $Root 'bin/ffmpeg.exe') -y -f lavfi -i 'testsrc=size=320x240:rate=25' -f lavfi -i 'sine=frequency=440:sample_rate=44100' -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 96k $sample | Out-Null
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $sample)){throw 'FFmpeg empacotado falhou no runner limpo.'}
          $probe=& (Join-Path $Root 'bin/ffprobe.exe') -v error -show_streams -show_format -of json $sample | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or -not ($probe.streams|Where-Object codec_type -eq 'video') -or -not ($probe.streams|Where-Object codec_type -eq 'audio')){throw 'FFprobe empacotado falhou no runner limpo.'}
          Write-Host 'GLOBAL_FFMPEG_NOT_REQUIRED=YES'
          Write-Host 'GLOBAL_FFPROBE_NOT_REQUIRED=YES'

          Invoke-NormalStart $Root 2
          $first=Invoke-Smoke $Root 'original'
          Invoke-NormalStart $Root 2
          Assert-NoOrphans $Root

          $log=Join-Path $Root 'logs/monitor-noticias.log'
          if(Test-Path $log){
            $logText=Get-Content $log -Raw -ErrorAction SilentlyContinue
            if($logText -match 'SEGREDO-FICTICIO-PASSO18'){throw 'Segredo fictício apareceu no log.'}
            if($logText -match '(?i)Traceback|ModuleNotFoundError|DLL load failed|could not find the Qt platform plugin'){throw 'Log contém erro estrutural do portable.'}
          }

          $movedBase=Join-Path $env:RUNNER_TEMP 'Movido Portable Monitor'
          if(Test-Path $movedBase){Remove-Item $movedBase -Recurse -Force}
          New-Item -ItemType Directory -Force $movedBase | Out-Null
          $movedRoot=Join-Path $movedBase 'Monitor de Notícias Validado'
          Move-Item $Root $movedRoot
          $script:Root=$movedRoot
          Assert-PortableStructure $Root
          Invoke-NormalStart $Root 2
          $moved=Invoke-Smoke $Root 'moved'
          Assert-NoOrphans $Root

          $rootTemp=Join-Path $Root 'temp'
          if(Test-Path $rootTemp){
            Get-ChildItem $rootTemp -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
            if(Get-ChildItem $rootTemp -Force -ErrorAction SilentlyContinue | Select-Object -First 1){throw 'Temporários bloqueados após smoke.'}
          }
          Assert-NoOrphans $Root
          Assert-PortableStructure $Root

          Write-Host 'PATH_COM_ESPACOS=OK'
          Write-Host 'PATH_COM_ACENTOS=OK'
          Write-Host 'CWD_DIFERENTE=OK'
          Write-Host 'PORTABLE_MOVE=OK'
          Write-Host 'REOPEN=OK'
          Write-Host 'PORT_001=RESOLVIDO'
          Write-Host 'PORT_002=RESOLVIDO'
          Write-Host 'PORT_003=RESOLVIDO'
          Write-Host 'PORT_004=RESOLVIDO'
          Write-Host 'PORT_005=RESOLVIDO'
          Write-Host 'PROCESSOS_ORFAOS=0'
          Write-Host 'SEGREDOS_REAIS_ENCONTRADOS=0'
          Write-Host 'DADOS_PESSOAIS_NO_ZIP=0'
          Write-Host 'COMPLIANCE_FINAL_SEGUNDO_RUNNER=PASS'
          Write-Host 'PUB_001=RESOLVIDO'
          Write-Host 'PUB_002=RESOLVIDO'
          Write-Host "PORTABLE_ZIP_VALIDATION_OK sha256=$runnerHash"
