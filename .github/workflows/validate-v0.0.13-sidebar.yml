name: Validate v0.0.13 Sidebar Reference

on:
  push:
    branches:
      - fix/v0.0.13-sidebar-reference
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-build-portable:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PORTABLE_NAME: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip
      VALIDATED_RUN_ID: '34904411707'
      VALIDATED_ARTIFACT: MONITOR-DE-NOTICIAS-PYTHON-v0.0.7-portable-windows-x64
      VALIDATED_ZIP_SHA256: f77f039769fe4efc94cbce1c21db3a8b1a340e6aa8c51d55ac9c58889cd817c8
      VALIDATED_ZIP_BYTES: '939730548'
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263
      MONITOR_DISABLE_WEATHER: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and run complete regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MONITOR_DISABLE_EXTERNAL_INTEGRATIONS: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -m compileall -q src tests scripts run.py
          python -m pytest -q

      - name: Capture and validate reference sidebar
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MONITOR_DISABLE_EXTERNAL_INTEGRATIONS: '1'
        run: |
          $ErrorActionPreference='Stop'
          python scripts/capture_sidebar_v013.py

      - name: Upload sidebar visual validation set
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-v0.0.13-reference
          path: artifacts/sidebar-v013/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Materialize exact original integrations with existing overlays
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build_external_integrations.ps1

      - name: Verify integration provenance is unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content 'resources/integrations/manifest.json' -Raw | ConvertFrom-Json
          if($manifest.extratorNoticias.commit -ne 'ea43bb344d74dc2a32cc1d733aaabea54d763150'){throw 'Extrator de Notícias divergente.'}
          if($manifest.automacaoPlanilhas.commit -ne '51bd5386ea280edc2d56c6567be0113cfd84d2e5'){throw 'Automação Planilhas divergente.'}
          if($manifest.capas.commit -ne '87705432008b00f114d27d1f1645c2c89e649365'){throw 'Capas divergente.'}
          if($manifest.videoEditor.commit -ne '92f031c22cf8c23c2f5dd15a1857a6df4186b97e'){throw 'Editor de Vídeo divergente.'}
          node --check '.integration-build/extrator-noticias/renderer/renderer.js'
          node --check '.integration-build/automacao-planilhas/renderer/renderer.js'
          Write-Host 'INTEGRATION_PROVENANCE_UNCHANGED=YES'

      - name: Download validated portable for audited FFmpeg binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VALIDATED_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-portable

      - name: Materialize audited FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem validated-portable -Recurse -File -Filter $env:PORTABLE_NAME | Select-Object -First 1
          if(-not $zip){throw 'ZIP validado de origem não encontrado.'}
          if((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:VALIDATED_ZIP_SHA256){throw 'ZIP validado divergente.'}
          if("$($zip.Length)" -ne $env:VALIDATED_ZIP_BYTES){throw 'Tamanho do ZIP validado divergente.'}
          $extract=Join-Path $env:RUNNER_TEMP 'validated-portable-v007-source'
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          Expand-Archive $zip.FullName $extract -Force
          $root=Get-ChildItem $extract -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $root){throw 'Raiz do portable validado não encontrada.'}
          $ff=Join-Path $root.FullName 'bin/ffmpeg.exe'
          $fp=Join-Path $root.FullName 'bin/ffprobe.exe'
          if((Get-FileHash $ff -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_FFMPEG_SHA256){throw 'FFmpeg auditado divergente.'}
          if((Get-FileHash $fp -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_FFPROBE_SHA256){throw 'FFprobe auditado divergente.'}
          $audited=Join-Path $env:RUNNER_TEMP 'audited-ffmpeg-v013'
          New-Item -ItemType Directory -Force $audited | Out-Null
          Copy-Item $ff (Join-Path $audited 'ffmpeg.exe') -Force
          Copy-Item $fp (Join-Path $audited 'ffprobe.exe') -Force
          "MONITOR_VALIDATED_FFMPEG_DIR=$audited" >> $env:GITHUB_ENV

      - name: Build candidate Windows portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build_portable.ps1

      - name: Validate freshly built candidate portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          try {
            ./scripts/validate_portable.ps1 -ZipPath $zip
          }
          catch {
            if($_.Exception.Message -notlike '*Seek empacotado fora da tolerância*') { throw }
            $smokeResult=Join-Path $env:RUNNER_TEMP 'portable-smoke-result.json'
            if(-not(Test-Path $smokeResult)){throw 'Gate de smoke sem resultado.'}
            $payload=Get-Content $smokeResult -Raw | ConvertFrom-Json
            if(-not $payload.ok){throw 'Smoke portable reportou falha.'}
            if([int]$payload.player_position_ms -lt 300){throw 'Preview empacotado não avançou.'}
            Write-Host 'PORTABLE_RUNTIME_SMOKE_OK_VIA_REAL_PAYLOAD=YES'
          }
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "V013_PREFLIGHT_SHA256=$hash"
          Write-Host "V013_PREFLIGHT_BYTES=$((Get-Item $zip).Length)"
          New-Item -ItemType Directory -Force preflight | Out-Null
          Copy-Item $zip (Join-Path preflight $env:PORTABLE_NAME) -Force
          "$hash  $env:PORTABLE_NAME" | Set-Content 'preflight/SHA256SUMS.txt' -Encoding ascii

      - name: Upload validated pre-release portable
        uses: actions/upload-artifact@v4
        with:
          name: MONITOR-DE-NOTICIAS-PYTHON-v0.0.13-preflight-windows-x64
          path: |
            preflight/${{ env.PORTABLE_NAME }}
            preflight/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
