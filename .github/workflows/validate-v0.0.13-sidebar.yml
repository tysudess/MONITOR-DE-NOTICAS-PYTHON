name: Validate v0.0.13 Sidebar Fidelity

on:
  push:
    branches:
      - fix/sidebar-reference-fidelity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sidebar:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      MONITOR_DISABLE_WEATHER: '1'
      MONITOR_DISABLE_EXTERNAL_INTEGRATIONS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and run complete regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m compileall -q src tests scripts run.py
          python -m pytest -q

      - name: Validate sidebar behavior and capture reference renders
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python scripts/capture_sidebar_reference.py

      - name: Upload sidebar validation renders
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-reference-renders
          path: artifacts/sidebar-reference/*.png
          if-no-files-found: error
          retention-days: 30
