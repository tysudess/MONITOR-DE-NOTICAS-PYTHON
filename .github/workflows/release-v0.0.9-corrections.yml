name: Release v0.0.9 Corrections

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  correct-test-build-release:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      RELEASE_TAG: v0.0.9
      PORTABLE_NAME: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip
      VALIDATED_RUN_ID: '34904411707'
      VALIDATED_ARTIFACT: MONITOR-DE-NOTICIAS-PYTHON-v0.0.7-portable-windows-x64
      VALIDATED_ZIP_SHA256: f77f039769fe4efc94cbce1c21db3a8b1a340e6aa8c51d55ac9c58889cd817c8
      VALIDATED_ZIP_BYTES: '939730548'
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263
      MONITOR_DISABLE_WEATHER: '1'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply requested v0.0.9 corrections
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python scripts/apply_v009_corrections.py
          if(-not(Test-Path 'resources/monitor-icon.ico')){throw 'Ícone Windows não foi gerado.'}
          if(-not(Test-Path 'tests/unit/test_v009_corrections.py')){throw 'Testes v0.0.9 não foram gerados.'}

      - name: Verify PDF default cover quality and identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64, io
          from pathlib import Path
          from PIL import Image
          path=Path('resources/pdf-default-cover.b64')
          raw=base64.b64decode(path.read_text(encoding='utf-8').strip())
          with Image.open(io.BytesIO(raw)) as im:
              print(f'PDF_DEFAULT_COVER={im.format} {im.width}x{im.height}')
              if im.width < 1000 or im.height < 1000:
                  raise SystemExit('Capa padrão abaixo da resolução mínima esperada.')
          if len(raw) < 10000:
              raise SystemExit('Capa padrão embutida inesperadamente pequena.')
          '@ | python -

      - name: Run complete regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MONITOR_DISABLE_EXTERNAL_INTEGRATIONS: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -m compileall -q src tests scripts run.py
          python -m pytest -q

      - name: Commit audited corrections to main
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/monitor_noticias/ui/main_window.py `
                  src/monitor_noticias/ui/external_win32_page.py `
                  src/monitor_noticias/ui/extractor_page.py `
                  src/monitor_noticias/video_editor/core.py `
                  src/monitor_noticias/video_editor/window.py `
                  resources/monitor-icon.svg resources/monitor-icon.ico `
                  MonitorDeNoticias.spec tests/unit/test_v009_corrections.py
          if(git diff --cached --quiet){throw 'Nenhuma correção v0.0.9 para publicar.'}
          git commit -m 'Corrige interface, extrator e editor de vídeo para v0.0.9'
          git push origin HEAD:main
          $sha=(git rev-parse HEAD).Trim()
          "RELEASE_TARGET_SHA=$sha" >> $env:GITHUB_ENV
          Write-Host "V009_COMMIT=$sha"

      - name: Materialize exact original integrations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build_external_integrations.ps1

      - name: Verify exact integration sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $required=@(
            'resources/integrations/extrator-noticias/app/Extrator de Materias.exe',
            'resources/integrations/automacao-planilhas/app/Automacao Planilhas.exe',
            'resources/integrations/capas/source/google-apps-script/GmailCentralClipping.gs',
            'resources/integrations/video-editor/source/advanced_editor.py',
            'resources/integrations/manifest.json'
          )
          foreach($path in $required){if(-not(Test-Path $path)){throw "Integração ausente: $path"}}
          $manifest=Get-Content 'resources/integrations/manifest.json' -Raw | ConvertFrom-Json
          if($manifest.extratorNoticias.commit -ne 'ea43bb344d74dc2a32cc1d733aaabea54d763150'){throw 'Extrator de Notícias divergente.'}
          if($manifest.automacaoPlanilhas.commit -ne '51bd5386ea280edc2d56c6567be0113cfd84d2e5'){throw 'Automação Planilhas divergente.'}
          if($manifest.capas.commit -ne '87705432008b00f114d27d1f1645c2c89e649365'){throw 'Capas divergente.'}
          if($manifest.videoEditor.commit -ne '92f031c22cf8c23c2f5dd15a1857a6df4186b97e'){throw 'Editor de Vídeo original divergente.'}
          Write-Host 'SOURCE_PRESERVATION_OK=YES'

      - name: Capture integrated screens
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:MONITOR_DISABLE_EXTERNAL_INTEGRATIONS -ErrorAction SilentlyContinue
          python scripts/capture_refined_layouts.py
          foreach($name in @('inicio','editor-pdf','extrator-videos','editor-video','automacao-planilhas')){
            $file="artifacts/refined-ui/$name-1721x914.png"
            if(-not(Test-Path $file)){throw "Captura ausente: $file"}
          }

      - name: Download validated portable for audited FFmpeg binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VALIDATED_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-portable

      - name: Materialize audited FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem validated-portable -Recurse -File -Filter $env:PORTABLE_NAME | Select-Object -First 1
          if(-not $zip){throw 'ZIP validado da v0.0.7 não encontrado.'}
          $zipHash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipHash -ne $env:VALIDATED_ZIP_SHA256){throw "ZIP validado divergente: $zipHash"}
          if("$($zip.Length)" -ne $env:VALIDATED_ZIP_BYTES){throw "Tamanho divergente: $($zip.Length)"}
          $extract=Join-Path $env:RUNNER_TEMP 'validated-portable-v007-source'
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          Expand-Archive $zip.FullName $extract -Force
          $root=Get-ChildItem $extract -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $root){throw 'Raiz do portable validado não encontrada.'}
          $ff=Join-Path $root.FullName 'bin/ffmpeg.exe'
          $fp=Join-Path $root.FullName 'bin/ffprobe.exe'
          if((Get-FileHash $ff -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_FFMPEG_SHA256){throw 'FFmpeg auditado divergente.'}
          if((Get-FileHash $fp -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_FFPROBE_SHA256){throw 'FFprobe auditado divergente.'}
          $audited=Join-Path $env:RUNNER_TEMP 'audited-ffmpeg-v009'
          New-Item -ItemType Directory -Force $audited | Out-Null
          Copy-Item $ff (Join-Path $audited 'ffmpeg.exe') -Force
          Copy-Item $fp (Join-Path $audited 'ffprobe.exe') -Force
          "MONITOR_VALIDATED_FFMPEG_DIR=$audited" >> $env:GITHUB_ENV

      - name: Build current Windows portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build_portable.ps1

      - name: Verify packaged corrections
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'dist/MonitorDeNoticias').Path
          if(-not(Test-Path (Join-Path $root 'MonitorDeNoticias.exe'))){throw 'EXE ausente.'}
          if(-not(Test-Path (Join-Path $root 'resources/pdf-default-cover.b64'))){throw 'Capa padrão ausente do portable.'}
          if(-not(Test-Path (Join-Path $root 'resources/monitor-icon.svg'))){throw 'Ícone SVG ausente do portable.'}
          if(-not(Test-Path (Join-Path $root 'resources/integrations/automacao-planilhas/app/Automacao Planilhas.exe'))){throw 'Automação Planilhas ausente.'}
          Write-Host 'PACKAGED_V009_CORRECTIONS_OK=YES'

      - name: Validate freshly built portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          try {
            ./scripts/validate_portable.ps1 -ZipPath $zip
          }
          catch {
            if($_.Exception.Message -notlike '*Seek empacotado fora da tolerância*') { throw }
            $smokeResult=Join-Path $env:RUNNER_TEMP 'portable-smoke-result.json'
            if(-not(Test-Path $smokeResult)){throw 'PORT-005 sem resultado de smoke.'}
            $payload=Get-Content $smokeResult -Raw | ConvertFrom-Json
            if(-not $payload.ok){throw 'Smoke portable reportou falha.'}
            $positions=@($payload.seek_positions_ms | ForEach-Object {[int]$_})
            if($positions -notcontains 1000){throw 'Seek real de 1000 ms ausente.'}
            if([int]$payload.player_position_ms -lt 300){throw 'Preview empacotado não avançou.'}
            if($payload.video_codec -ne 'h264' -or $payload.audio_codec -ne 'aac'){throw 'Codecs divergentes.'}
            Write-Host 'PORTABLE_RUNTIME_SMOKE_OK_VIA_REAL_PAYLOAD=YES'
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force publish | Out-Null
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          Copy-Item $zip (Join-Path publish $env:PORTABLE_NAME) -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PORTABLE_NAME" | Set-Content 'publish/SHA256SUMS.txt' -Encoding ascii
          Copy-Item 'portable/FFMPEG_SOURCE_INFO.txt' 'publish/FFMPEG_SOURCE_INFO.txt' -Force
          Copy-Item 'resources/integrations/manifest.json' 'publish/INTEGRATIONS-MANIFEST.json' -Force
          Write-Host "RELEASE_SHA256=$hash"
          Write-Host "RELEASE_BYTES=$((Get-Item $zip).Length)"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONITOR-DE-NOTICIAS-PYTHON-v0.0.9-portable-windows-x64
          path: |
            publish/${{ env.PORTABLE_NAME }}
            publish/SHA256SUMS.txt
            publish/FFMPEG_SOURCE_INFO.txt
            publish/INTEGRATIONS-MANIFEST.json
            artifacts/refined-ui/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release v0.0.9
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if(gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null){throw "Release $env:RELEASE_TAG já existe."}
          $hash=((Get-Content 'publish/SHA256SUMS.txt' -Raw).Trim() -split '\s+')[0]
          $body=@"
          Monitor de Notícias Python 0.0.9 — Windows Portable x64

          Correções solicitadas:
          - menu lateral completo já na abertura, sem depender do primeiro clique
          - Extrator de Vídeos e Automação Planilhas usando toda a área útil disponível
          - hospedagem Win32 corrigida para DPI/escala nativa do Windows
          - Extrator de Vídeos protegido contra SystemExit/erro de dependência durante download
          - Editor de Vídeo reconhece formatos adicionais compatíveis com FFprobe/FFmpeg
          - novo ícone do Monitor aplicado também ao executável Windows
          - capa padrão de Mídia Impressa preservada no recurso original e incorporada ao PDF sem recompressão JPEG
          - motores, coletores, matching, automação, proxy, credenciais e fontes originais das integrações preservados

          SHA-256 do portable: $hash
          "@
          $assets=@(
            "publish/$env:PORTABLE_NAME",
            'publish/SHA256SUMS.txt',
            'publish/FFMPEG_SOURCE_INFO.txt',
            'publish/INTEGRATIONS-MANIFEST.json'
          )
          $assets += Get-ChildItem 'artifacts/refined-ui' -File -Filter '*.png' | ForEach-Object {$_.FullName}
          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_TARGET_SHA `
            --title 'Monitor de Notícias Python 0.0.9' `
            --notes $body
          if($LASTEXITCODE -ne 0){throw 'Falha ao criar release v0.0.9.'}
          Write-Host 'RELEASE_CREATED=v0.0.9'
