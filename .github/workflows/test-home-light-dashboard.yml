name: Test Light Home Portable

on:
  push:
    branches:
      - redesign/home-light-dashboard-final
    paths:
      - '.github/workflows/test-home-light-dashboard.yml'
      - 'run.py'
      - 'scripts/build_light_home_redesign.ps1'
      - 'src/monitor_noticias/ui/v021_light_home_dashboard.py'
      - 'src/monitor_noticias/ui/v019_news_reference.py'
      - 'src/monitor_noticias/ui/v019_news_scroll_fix.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portable-test:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_light_home_redesign.ps1

      - name: Upload portable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: light-home-redesign-portable-windows-x64
          path: portable-test-artifact/*
          if-no-files-found: error
          retention-days: 7
