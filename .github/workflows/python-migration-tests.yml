name: Python migration tests

on:
  workflow_dispatch:
  push:
    branches:
      - migration/python-foundation
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/python-migration-tests.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libpulse0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run complete test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

# Step 8: matrix Windows/Ubuntu valida regressão completa e integrações nativas com dados fictícios.
# Step 9: a mesma matriz executa também os testes reais da UI PySide6 em modo offscreen.
# Step 12: QtMultimedia exige libpulse0 no runner Linux para carregar QMediaPlayer/QAudioOutput.
