name: Passo 24 - Verify Portable Compliance

on:
  push:
    branches:
      - migration/python-foundation
    paths:
      - '.github/workflows/pass24-compliance-verify.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-compliance-on-clean-windows:
    runs-on: windows-latest
    steps:
      - name: Download exact Passo 24 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
          path: artifact
          github-token: ${{ github.token }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: 34794644131

      - name: Verify exact ZIP and compliance payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((Test-Path 'src') -or (Test-Path 'tests') -or (Test-Path '.git')){throw 'Checkout de desenvolvimento inesperado.'}
          $zip=(Get-ChildItem artifact -Recurse -Filter 'MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip' | Select-Object -First 1).FullName
          if(-not $zip){throw 'ZIP não encontrado.'}
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item $zip).Length
          if($hash -ne '36e161e4ce27103b6668a4471fe381b03ec28c1b6231a9fd137fa2672cfd9ede'){throw "SHA inesperado: $hash"}
          if($bytes -ne 477381768){throw "Tamanho inesperado: $bytes"}
          $root=Join-Path $env:RUNNER_TEMP 'Passo 24 Compliance Monitor de Notícias'
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          Expand-Archive $zip $root -Force
          $portable=Get-ChildItem $root -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $portable){throw 'Raiz portable ausente.'}
          $p=$portable.FullName
          $required=@(
            'THIRD_PARTY_NOTICES.txt',
            'LICENSES-MANIFEST.json',
            'licenses/python-runtime/LICENSE.txt',
            'licenses/ffmpeg/COPYING.GPLv3.txt',
            'licenses/ffmpeg/LICENSE.md',
            'licenses/yt-dlp-stable/THIRD_PARTY_LICENSES.txt',
            'licenses/yt-dlp-stable/LICENSE.txt',
            'licenses/yt-dlp-nightly/THIRD_PARTY_LICENSES.txt',
            'licenses/yt-dlp-nightly/LICENSE.txt',
            'licenses/deno/LICENSE.md'
          )
          foreach($rel in $required){
            $full=Join-Path $p $rel
            if(-not (Test-Path $full -PathType Leaf)){throw "Arquivo de compliance ausente: $rel"}
            $text=Get-Content $full -Raw -ErrorAction Stop
            if([string]::IsNullOrWhiteSpace($text)){throw "Arquivo de compliance vazio: $rel"}
          }
          $licenseFiles=Get-ChildItem (Join-Path $p 'licenses') -Recurse -File
          if($licenseFiles.Count -lt 20){throw "Poucos arquivos de licença: $($licenseFiles.Count)"}
          $manifest=Get-Content (Join-Path $p 'LICENSES-MANIFEST.json') -Raw | ConvertFrom-Json
          if(-not $manifest.python_runtime -or $manifest.python_distributions.Count -lt 10 -or $manifest.external_components.Count -lt 7){throw 'Manifest de compliance incompleto.'}
          $localLeak=$licenseFiles | Where-Object {
            (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match '(?i)D:\\a\\|C:\\Users\\runneradmin|/home/runner|rodrigodess@yahoo\.com'
          }
          if($localLeak){throw "Texto de licença contém path/dado local: $(($localLeak.FullName)-join '; ')"}
          Write-Host "PASS24_ONLY_ARTIFACT=YES"
          Write-Host "PASS24_ZIP_SHA256=$hash"
          Write-Host "PASS24_ZIP_BYTES=$bytes"
          Write-Host "PASS24_THIRD_PARTY_NOTICES=PASS"
          Write-Host "PASS24_LICENSES_DIRECTORY=PASS"
          Write-Host "PASS24_LICENSES_MANIFEST=PASS"
          Write-Host "PASS24_LICENSE_FILE_COUNT=$($licenseFiles.Count)"
          Write-Host "PASS24_LICENSE_FILES_READABLE=PASS"
          Write-Host "PASS24_LICENSE_FILES_LOCAL_DATA=0"
