name: Passo 15 release readiness

on:
  workflow_dispatch:
  push:
    branches:
      - migration/python-foundation
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/pass15_**'
      - 'run.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/pass15-release-readiness.yml'

permissions:
  contents: read

jobs:
  readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libpulse0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Prepare baseline FFmpeg and FFprobe for Windows gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $sources=@(
            'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip',
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          )
          $ok=$false
          foreach($source in $sources){
            try{
              Invoke-WebRequest -Uri $source -OutFile 'ffmpeg.zip' -TimeoutSec 240
              if((Get-Item 'ffmpeg.zip').Length -gt 1000000){$ok=$true;break}
            } catch { Write-Warning $_.Exception.Message }
          }
          if(-not $ok){throw 'Não foi possível obter FFmpeg para o gate.'}
          Expand-Archive 'ffmpeg.zip' 'ffmpeg-temp' -Force
          $ffmpeg=Get-ChildItem 'ffmpeg-temp' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe=Get-ChildItem 'ffmpeg-temp' -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if(-not $ffmpeg -or -not $ffprobe){throw 'ffmpeg/ffprobe ausentes no gate.'}
          New-Item -ItemType Directory -Force -Path 'bin' | Out-Null
          Copy-Item $ffmpeg.FullName 'bin/ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName 'bin/ffprobe.exe' -Force
          & 'bin/ffmpeg.exe' -version | Select-Object -First 1
          & 'bin/ffprobe.exe' -version | Select-Object -First 1
      - name: Compile all Python
        run: python -m compileall -q src tests scripts run.py
      - name: Complete suite with reasons
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -ra --durations=20
      - name: Static gate inventory
        shell: bash
        run: |
          set -u
          echo '=== PLACEHOLDER TOKENS IN src ==='
          grep -RInE '\b(TODO|FIXME|NotImplemented|placeholder|stub|fake|mock|demo|sample)\b|^[[:space:]]*pass([[:space:]]*(#.*)?)?$' src || true
          echo '=== SKIP/XFAIL DECLARATIONS ==='
          grep -RInE 'pytest\.mark\.(skip|skipif|xfail)|pytest\.(skip|xfail)|@unittest\.skip|expectedFailure' tests || true
          echo '=== ABSOLUTE DEVELOPMENT PATH CANDIDATES ==='
          grep -RInE '([A-Za-z]:\\Users\\|/home/[^/]+/|/Users/[^/]+/|\.venv|venv/Scripts|site-packages)' src run.py || true
          echo '=== FFMPEG/FFPROBE COMMAND SITES ==='
          grep -RInE 'ffmpeg|ffprobe' src/monitor_noticias || true
      - name: Entry point smoke from foreign CWD and portable-like path
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/pass15_entrypoint_smoke.py
      - name: Real FFmpeg and FFprobe media smoke
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/pass15_media_smoke.py
