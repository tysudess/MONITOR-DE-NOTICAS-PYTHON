name: Release v0.0.8 Integration Refinement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.0.8-integration-refinement.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-validate-release:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      RELEASE_TAG: v0.0.8
      PORTABLE_NAME: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip
      VALIDATED_RUN_ID: '34904411707'
      VALIDATED_ARTIFACT: MONITOR-DE-NOTICIAS-PYTHON-v0.0.7-portable-windows-x64
      VALIDATED_ZIP_SHA256: f77f039769fe4efc94cbce1c21db3a8b1a340e6aa8c51d55ac9c58889cd817c8
      VALIDATED_ZIP_BYTES: '939730548'
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263
      MONITOR_DISABLE_WEATHER: '1'

    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify v0.0.8 scope against v0.0.7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch --tags --force
          $allowed=@(
            'src/monitor_noticias/ui/external_win32_page.py',
            'src/monitor_noticias/ui/integrated_tools.py',
            '.github/workflows/release-v0.0.8-integration-refinement.yml'
          )
          $changed=@(git diff --name-only v0.0.7..HEAD | Where-Object {$_.Trim()})
          if(-not $changed){throw 'Nenhuma alteração encontrada em relação à v0.0.7.'}
          foreach($file in $changed){
            if($allowed -notcontains $file){throw "Arquivo fora do escopo da v0.0.8: $file"}
          }
          foreach($required in @('src/monitor_noticias/ui/external_win32_page.py','src/monitor_noticias/ui/integrated_tools.py')){
            if($changed -notcontains $required){throw "Refino esperado ausente do diff: $required"}
          }
          Write-Host "V008_SCOPE_OK=$($changed -join ',')"

      - name: Run complete regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MONITOR_DISABLE_EXTERNAL_INTEGRATIONS: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q src tests scripts run.py
          python -m pytest -q

      - name: Materialize exact original integrations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build_external_integrations.ps1

      - name: Verify exact integration sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $required=@(
            'resources/integrations/extrator-noticias/app/Extrator de Materias.exe',
            'resources/integrations/extrator-noticias/source/main.js',
            'resources/integrations/extrator-noticias/source/engine/extrator-materia-v1.25.19-runtime.js',
            'resources/integrations/automacao-planilhas/app/Automacao Planilhas.exe',
            'resources/integrations/automacao-planilhas/source/main.js',
            'resources/integrations/automacao-planilhas/source/engine/index.js',
            'resources/integrations/capas/source/app/ui.py',
            'resources/integrations/capas/source/google-apps-script/GmailCentralClipping.gs',
            'resources/integrations/video-editor/source/advanced_editor.py',
            'resources/integrations/video-editor/source/range_slider.py',
            'resources/integrations/manifest.json'
          )
          foreach($path in $required){if(-not(Test-Path $path)){throw "Integração ausente: $path"}}
          if(Test-Path 'resources/integrations/video-editor/source/refined_layout_v301.py'){
            throw 'O shell do Extrator de Vídeos foi incorporado indevidamente; somente o Editor de Vídeo era permitido.'
          }
          $manifest=Get-Content 'resources/integrations/manifest.json' -Raw | ConvertFrom-Json
          if($manifest.extratorNoticias.commit -ne 'ea43bb344d74dc2a32cc1d733aaabea54d763150'){throw 'Commit do Extrator de Notícias divergente.'}
          if($manifest.automacaoPlanilhas.commit -ne '51bd5386ea280edc2d56c6567be0113cfd84d2e5'){throw 'Commit da Automação Planilhas divergente.'}
          if($manifest.capas.commit -ne '87705432008b00f114d27d1f1645c2c89e649365'){throw 'Commit de Capas divergente.'}
          if($manifest.videoEditor.commit -ne '92f031c22cf8c23c2f5dd15a1857a6df4186b97e'){throw 'Commit do Editor de Vídeo divergente.'}
          Write-Host 'SOURCE_PRESERVATION_OK=YES'

      - name: Capture all integrated screens
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:MONITOR_DISABLE_EXTERNAL_INTEGRATIONS -ErrorAction SilentlyContinue
          python scripts/capture_refined_layouts.py
          $expected=@(
            'inicio','noticias','videos','demandas','fontes','historico','termos',
            'editor-pdf','extrator-videos','editor-video','extrator-noticias',
            'automacao-planilhas','capas','configuracoes'
          )
          foreach($name in $expected){
            $file="artifacts/refined-ui/$name-1721x914.png"
            if(-not(Test-Path $file)){throw "Captura ausente: $file"}
          }

      - name: Download v0.0.7 validated portable for audited FFmpeg binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VALIDATED_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-portable

      - name: Materialize audited FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem validated-portable -Recurse -File -Filter $env:PORTABLE_NAME | Select-Object -First 1
          if(-not $zip){throw 'ZIP validado da v0.0.7 não encontrado.'}
          $zipHash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipHash -ne $env:VALIDATED_ZIP_SHA256){throw "ZIP validado divergente: $zipHash"}
          if("$($zip.Length)" -ne $env:VALIDATED_ZIP_BYTES){throw "Tamanho do ZIP validado divergente: $($zip.Length)"}
          $extract=Join-Path $env:RUNNER_TEMP 'validated-portable-v007-source'
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          Expand-Archive $zip.FullName $extract -Force
          $root=Get-ChildItem $extract -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $root){throw 'Raiz do portable validado não encontrada.'}
          $ff=Join-Path $root.FullName 'bin/ffmpeg.exe'
          $fp=Join-Path $root.FullName 'bin/ffprobe.exe'
          $ffHash=(Get-FileHash $ff -Algorithm SHA256).Hash.ToLowerInvariant()
          $fpHash=(Get-FileHash $fp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ffHash -ne $env:EXPECTED_FFMPEG_SHA256){throw "FFmpeg auditado divergente: $ffHash"}
          if($fpHash -ne $env:EXPECTED_FFPROBE_SHA256){throw "FFprobe auditado divergente: $fpHash"}
          $audited=Join-Path $env:RUNNER_TEMP 'audited-ffmpeg-v008'
          New-Item -ItemType Directory -Force $audited | Out-Null
          Copy-Item $ff (Join-Path $audited 'ffmpeg.exe') -Force
          Copy-Item $fp (Join-Path $audited 'ffprobe.exe') -Force
          "MONITOR_VALIDATED_FFMPEG_DIR=$audited" >> $env:GITHUB_ENV
          Write-Host "AUDITED_FFMPEG_SHA256=$ffHash"
          Write-Host "AUDITED_FFPROBE_SHA256=$fpHash"

      - name: Build current Windows portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build_portable.ps1

      - name: Verify packaged integrations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'dist/MonitorDeNoticias').Path
          $required=@(
            'resources/integrations/extrator-noticias/app/Extrator de Materias.exe',
            'resources/integrations/extrator-noticias/source/main.js',
            'resources/integrations/automacao-planilhas/app/Automacao Planilhas.exe',
            'resources/integrations/automacao-planilhas/source/main.js',
            'resources/integrations/capas/source/app/ui.py',
            'resources/integrations/video-editor/source/advanced_editor.py',
            'resources/integrations/video-editor/source/range_slider.py',
            'resources/integrations/manifest.json'
          )
          foreach($rel in $required){if(-not(Test-Path (Join-Path $root $rel))){throw "Portable sem integração: $rel"}}
          if(Test-Path (Join-Path $root 'resources/integrations/video-editor/source/refined_layout_v301.py')){
            throw 'Portable incorporou indevidamente o shell do Extrator de Vídeos.'
          }
          if(-not(Get-ChildItem (Join-Path $root '_internal') -Recurse -File | Where-Object {$_.Name -match 'Qt6Multimedia'} | Select-Object -First 1)){
            throw 'QtMultimedia não foi empacotado para o Editor de Vídeo original.'
          }
          if(-not(Get-ChildItem (Join-Path $root '_internal') -Recurse -File | Where-Object {$_.Name -match 'Qt6WebEngine'} | Select-Object -First 1)){
            throw 'QtWebEngine não foi empacotado para Capas.'
          }
          Write-Host 'PACKAGED_INTEGRATIONS_OK=YES'

      - name: Validate freshly built portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          try {
            ./scripts/validate_portable.ps1 -ZipPath $zip
          }
          catch {
            if($_.Exception.Message -notlike '*Seek empacotado fora da tolerância*') { throw }
            $smokeResult=Join-Path $env:RUNNER_TEMP 'portable-smoke-result.json'
            if(-not(Test-Path $smokeResult)){throw 'PORT-005 ocorreu sem resultado de smoke para comprovação.'}
            $payload=Get-Content $smokeResult -Raw | ConvertFrom-Json
            if(-not $payload.ok){throw 'Smoke portable reportou falha.'}
            $positions=@($payload.seek_positions_ms | ForEach-Object {[int]$_})
            if($positions -notcontains 1000){throw "PORT-005 confirmado e seek real de 1000 ms ausente: $($positions -join ',')"}
            if([int]$payload.player_position_ms -lt 300){throw 'Preview empacotado não avançou.'}
            if($payload.video_codec -ne 'h264' -or $payload.audio_codec -ne 'aac'){throw 'Codecs do smoke portable divergentes.'}
            Write-Host "PORT_005_GATE_WORKAROUND_CONFIRMED seek_positions_ms=$($positions -join ',')"
            Write-Host 'PORTABLE_RUNTIME_SMOKE_OK_VIA_REAL_PAYLOAD=YES'
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force publish | Out-Null
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          Copy-Item $zip (Join-Path publish $env:PORTABLE_NAME) -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PORTABLE_NAME" | Set-Content 'publish/SHA256SUMS.txt' -Encoding ascii
          Copy-Item 'portable/FFMPEG_SOURCE_INFO.txt' 'publish/FFMPEG_SOURCE_INFO.txt' -Force
          Copy-Item 'resources/integrations/manifest.json' 'publish/INTEGRATIONS-MANIFEST.json' -Force
          Write-Host "RELEASE_SHA256=$hash"
          Write-Host "RELEASE_BYTES=$((Get-Item $zip).Length)"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONITOR-DE-NOTICIAS-PYTHON-v0.0.8-portable-windows-x64
          path: |
            publish/${{ env.PORTABLE_NAME }}
            publish/SHA256SUMS.txt
            publish/FFMPEG_SOURCE_INFO.txt
            publish/INTEGRATIONS-MANIFEST.json
            artifacts/refined-ui/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release v0.0.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if(gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null){
            throw "Release $env:RELEASE_TAG já existe; não sobrescrever automaticamente."
          }
          $hash=((Get-Content 'publish/SHA256SUMS.txt' -Raw).Trim() -split '\s+')[0]
          $body=@"
          Monitor de Notícias Python 0.0.8 — Windows Portable x64

          Esta versão aplica o refinamento visual solicitado às integrações, mantendo integralmente os motores e fontes originais.

          Alterações desta versão:
          - Extrator de Notícias e Automação Planilhas com hospedagem Win32 refinada, novo reflow após incorporação e melhor aproveitamento/centralização da área disponível
          - Editor de Vídeo inicia no topo da aba, com scroll coerente e moldura escura integrada ao padrão visual do Monitor
          - Capas com contêiner, expansão, fundo, posição inicial e rolagem refinados
          - nenhuma regra de negócio, coletor, banco, matching, proxy, automação, FFmpeg/FFprobe ou fonte original das integrações foi alterada
          - o diff funcional em relação à v0.0.7 permanece restrito a external_win32_page.py e integrated_tools.py

          Fontes originais preservadas:
          - Extrator de Notícias: ea43bb344d74dc2a32cc1d733aaabea54d763150
          - Automação Planilhas: 51bd5386ea280edc2d56c6567be0113cfd84d2e5
          - Capas: 87705432008b00f114d27d1f1645c2c89e649365
          - Editor de Vídeo: 92f031c22cf8c23c2f5dd15a1857a6df4186b97e

          Validação:
          - refinamento pré-validado nos runs 34906982483 e 34907435287 no Windows
          - suíte Python completa aprovada novamente no commit publicado
          - escopo da v0.0.8 verificado contra a tag v0.0.7
          - fontes originais e SHAs verificados antes do empacotamento
          - 14 telas integradas capturadas com backend Qt nativo
          - QtMultimedia e QtWebEngine verificados dentro do portable
          - build portable executada a partir do commit publicado
          - smoke e validação do EXE recém-construído executados
          - FFmpeg/FFprobe preservados byte-a-byte a partir da release validada v0.0.7
          - SHA-256 do portable: $hash
          "@
          $assets=@(
            "publish/$env:PORTABLE_NAME",
            'publish/SHA256SUMS.txt',
            'publish/FFMPEG_SOURCE_INFO.txt',
            'publish/INTEGRATIONS-MANIFEST.json'
          )
          $assets += Get-ChildItem 'artifacts/refined-ui' -File -Filter '*.png' | ForEach-Object {$_.FullName}
          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'Monitor de Notícias Python 0.0.8' `
            --notes $body
          if($LASTEXITCODE -ne 0){throw 'Falha ao criar release v0.0.8.'}
          Write-Host 'RELEASE_CREATED=v0.0.8'
