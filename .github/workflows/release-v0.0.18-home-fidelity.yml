name: Release v0.0.18 Home Fidelity

# Workflow histórico preservado somente para execução manual.
# Releases posteriores não podem reativar/publicar novamente a tag v0.0.18.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, validar e publicar v0.0.18
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release_v018.ps1
