name: Trigger v0.0.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-v0.0.9.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release v0.0.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-v0.0.9-corrections.yml --repo ${{ github.repository }} --ref main
