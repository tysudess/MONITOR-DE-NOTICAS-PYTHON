name: Prepare and Trigger v0.0.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-and-trigger-v0.0.9.yml'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier
        run: python -m pip install Pillow

      - name: Validate and encode exact MÍDIA IMPRESSA HD cover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image

          source = Path('resources/pdf-default-cover.webp')
          if not source.is_file():
              raise SystemExit('Recurso HD da capa não encontrado.')
          with Image.open(source) as im:
              im.load()
              print(f'HD_COVER={im.format} {im.width}x{im.height} bytes={source.stat().st_size}')
              if (im.width, im.height) != (1245, 2048):
                  raise SystemExit(f'Capa HD inesperada: {im.width}x{im.height}')
          encoded = base64.b64encode(source.read_bytes()).decode('ascii')
          Path('resources/pdf-default-cover.b64').write_text(encoded, encoding='utf-8')
          PY

      - name: Commit HD default cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/pdf-default-cover.b64
          if ! git diff --cached --quiet; then
            git commit -m 'Define capa MÍDIA IMPRESSA HD como padrão do Editor PDF'
            git push origin HEAD:main
          fi

      - name: Dispatch validated v0.0.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-v0.0.9-corrections.yml --repo ${{ github.repository }} --ref main
