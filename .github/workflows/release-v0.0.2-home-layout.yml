name: Release v0.0.2 Home Layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.0.2-home-layout.yml'
      - 'src/monitor_noticias/ui/home_dashboard.py'
      - 'src/monitor_noticias/ui/main_window.py'
      - 'scripts/capture_home_layout.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-validate-release:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      RELEASE_TAG: v0.0.2
      PORTABLE_NAME: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip
      VALIDATED_RUN_ID: '34794644131'
      VALIDATED_ARTIFACT: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
      VALIDATED_ZIP_SHA256: 36e161e4ce27103b6668a4471fe381b03ec28c1b6231a9fd137fa2672cfd9ede
      VALIDATED_ZIP_BYTES: '477381768'
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263

    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q src tests scripts run.py
          python -m pytest -q

      - name: Capture HOME at reference resolution
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/capture_home_layout.py
          if(-not (Test-Path 'artifacts/home-1721x914.png')){throw 'Screenshot HOME ausente.'}

      - name: Download last validated portable for audited FFmpeg binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VALIDATED_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-portable

      - name: Materialize audited FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem validated-portable -Recurse -File -Filter $env:PORTABLE_NAME | Select-Object -First 1
          if(-not $zip){throw 'ZIP validado anterior não encontrado.'}
          $zipHash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipHash -ne $env:VALIDATED_ZIP_SHA256){throw "ZIP validado divergente: $zipHash"}
          if("$($zip.Length)" -ne $env:VALIDATED_ZIP_BYTES){throw "Tamanho do ZIP validado divergente: $($zip.Length)"}
          $extract=Join-Path $env:RUNNER_TEMP 'validated-portable-v001'
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          Expand-Archive $zip.FullName $extract -Force
          $root=Get-ChildItem $extract -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe')} | Select-Object -First 1
          if(-not $root){throw 'Raiz do portable validado não encontrada.'}
          $ff=Join-Path $root.FullName 'bin/ffmpeg.exe'
          $fp=Join-Path $root.FullName 'bin/ffprobe.exe'
          $ffHash=(Get-FileHash $ff -Algorithm SHA256).Hash.ToLowerInvariant()
          $fpHash=(Get-FileHash $fp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ffHash -ne $env:EXPECTED_FFMPEG_SHA256){throw "FFmpeg auditado divergente: $ffHash"}
          if($fpHash -ne $env:EXPECTED_FFPROBE_SHA256){throw "FFprobe auditado divergente: $fpHash"}
          $audited=Join-Path $env:RUNNER_TEMP 'audited-ffmpeg-v002'
          New-Item -ItemType Directory -Force $audited | Out-Null
          Copy-Item $ff (Join-Path $audited 'ffmpeg.exe') -Force
          Copy-Item $fp (Join-Path $audited 'ffprobe.exe') -Force
          "MONITOR_VALIDATED_FFMPEG_DIR=$audited" >> $env:GITHUB_ENV
          Write-Host "AUDITED_FFMPEG_SHA256=$ffHash"
          Write-Host "AUDITED_FFPROBE_SHA256=$fpHash"

      - name: Build current Windows portable
        shell: pwsh
        run: ./scripts/build_portable.ps1

      - name: Validate freshly built portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          ./scripts/validate_portable.ps1 -ZipPath $zip

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force publish | Out-Null
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          Copy-Item $zip (Join-Path publish $env:PORTABLE_NAME) -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PORTABLE_NAME" | Set-Content 'publish/SHA256SUMS.txt' -Encoding ascii
          Copy-Item 'portable/FFMPEG_SOURCE_INFO.txt' 'publish/FFMPEG_SOURCE_INFO.txt' -Force
          Write-Host "RELEASE_SHA256=$hash"
          Write-Host "RELEASE_BYTES=$((Get-Item $zip).Length)"

      - name: Upload validated portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONITOR-DE-NOTICIAS-PYTHON-v0.0.2-portable-windows-x64
          path: |
            publish/${{ env.PORTABLE_NAME }}
            publish/SHA256SUMS.txt
            artifacts/home-1721x914.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release v0.0.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if(gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null){
            throw "Release $env:RELEASE_TAG já existe; não sobrescrever automaticamente."
          }
          $hash=((Get-Content 'publish/SHA256SUMS.txt' -Raw).Trim() -split '\s+')[0]
          $body=@"
          Monitor de Notícias Python 0.0.2 — Windows Portable x64

          Atualização visual da tela Início reproduzida a partir da referência 1721 x 914 fornecida, preservando o motor, callbacks, dados dinâmicos, automação, banco, coletores, editores e fluxo portable existentes.

          Validação desta publicação:
          - suíte completa de testes: aprovada no Windows
          - captura da tela Início: 1721 x 914
          - sidebar da referência: 255 px
          - navegação visível no Início: 9 itens
          - build portable atual executada a partir deste commit
          - validação e smoke do ZIP recém-construído: aprovados
          - SHA-256 do portable: $hash

          FFmpeg/FFprobe permanecem byte-a-byte os binários auditados da publicação anterior. O arquivo FFMPEG_SOURCE_INFO.txt acompanha a release; o corresponding source congelado dos mesmos binários permanece publicado nos assets da v0.0.1.
          "@
          gh release create $env:RELEASE_TAG `
            "publish/$env:PORTABLE_NAME" `
            'publish/SHA256SUMS.txt' `
            'publish/FFMPEG_SOURCE_INFO.txt' `
            'artifacts/home-1721x914.png' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'Monitor de Notícias Python 0.0.2' `
            --notes $body
          if($LASTEXITCODE -ne 0){throw 'Falha ao criar release v0.0.2.'}
          Write-Host 'RELEASE_CREATED=v0.0.2'
