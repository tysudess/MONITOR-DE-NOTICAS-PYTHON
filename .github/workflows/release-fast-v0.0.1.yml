name: Release v0.0.1 Immediate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-fast-v0.0.1.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download validated portable
        uses: actions/download-artifact@v4
        with:
          name: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: '34794644131'
          github-token: ${{ github.token }}
          path: publish

      - name: Verify portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem publish -Recurse -File -Filter 'MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip' | Select-Object -First 1
          if(-not $zip){throw 'Portable ausente.'}
          $hash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '36e161e4ce27103b6668a4471fe381b03ec28c1b6231a9fd137fa2672cfd9ede'){throw "SHA divergente: $hash"}
          if($zip.Length -ne 477381768){throw "Tamanho divergente: $($zip.Length)"}
          "$hash  MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip" | Set-Content 'publish/SHA256SUMS.txt' -Encoding ascii
          Write-Host "PORTABLE_RELEASE_SHA256=$hash"

      - name: Publish v0.0.1 now
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if(gh release view v0.0.1 --repo $env:GITHUB_REPOSITORY 2>$null){
            Write-Host 'RELEASE_ALREADY_EXISTS=v0.0.1'
            exit 0
          }
          $body=@'
          Monitor de Notícias Python 0.0.1 — Windows Portable x64

          Portable Windows x64 validado no run 34794644131.
          SHA-256: 36e161e4ce27103b6668a4471fe381b03ec28c1b6231a9fd137fa2672cfd9ede

          A publicação foi autorizada explicitamente sem aguardar os gates finais que ainda estavam em andamento. Materiais adicionais de corresponding source podem ser anexados separadamente à mesma Release.
          '@
          gh release create v0.0.1 `
            'publish/MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip' `
            'publish/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'Monitor de Notícias Python 0.0.1' `
            --notes $body
          if($LASTEXITCODE -ne 0){throw 'Falha ao criar release imediata.'}
          Write-Host 'RELEASE_CREATED=v0.0.1'
